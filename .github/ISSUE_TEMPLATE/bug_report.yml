name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please **never paste your
        `credentials.json`, client secret or tokens** into an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Settings → Advanced → Logs → Open. Paste the lines around the error.
      render: text
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under Settings → About
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options:
        - Portable .exe
        - Folder build (.zip)
        - From source (python app.py)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
