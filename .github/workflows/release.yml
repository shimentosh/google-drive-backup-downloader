name: Release

# Push a tag like v1.1.0 and this builds the Windows app and publishes it as a
# GitHub Release with two downloads: a portable .exe and a folder-build .zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build portable single-file exe
        shell: pwsh
        run: |
          $env:GDBD_ONEFILE = "1"
          python -m PyInstaller --noconfirm --clean packaging/drive_backup.spec
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item dist/GoogleDriveBackupDownloader.exe release/GoogleDriveBackupDownloader-portable.exe

      - name: Build folder version (starts faster)
        shell: pwsh
        run: |
          $env:GDBD_ONEFILE = "0"
          python -m PyInstaller --noconfirm --clean packaging/drive_backup.spec
          Compress-Archive -Path dist/GoogleDriveBackupDownloader -DestinationPath release/GoogleDriveBackupDownloader-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Download

            | File | Best for |
            |---|---|
            | **GoogleDriveBackupDownloader-portable.exe** | Easiest: one file, just double-click it |
            | **GoogleDriveBackupDownloader-windows.zip** | Starts faster: unzip, then run `GoogleDriveBackupDownloader.exe` |

            Windows SmartScreen may say *"Windows protected your PC"* because the app is not
            code-signed. Click **More info → Run anyway**.

            First time? Follow the [5-minute Google setup](https://github.com/shimentosh/google-drive-backup-downloader#google-cloud-setup).

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*
